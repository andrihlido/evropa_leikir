<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tímalína · Evrópuleikir</title>
<link rel="stylesheet" href="../css/still.css">
<style>
.atburdir{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.atburdur{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#f3f6f9;border:2px solid transparent;border-radius:10px;padding:10px 12px}
.atburdur .ar{font-family:var(--display);font-weight:800;font-size:18px;min-width:5.5em;color:var(--muted);font-variant-numeric:tabular-nums}
.atburdur .texti{font-weight:700}
.faerslur{display:flex;gap:4px}
.faerslur button{width:40px;height:40px;border-radius:8px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:800;cursor:pointer}
.faerslur button:disabled{opacity:.3;cursor:default}
.atburdur.rett{border-color:var(--rett);background:var(--rett-bg)}
.atburdur.rangt{border-color:var(--rangt);background:var(--rangt-bg)}
.atburdur.rett .ar{color:var(--rett)} .atburdur.rangt .ar{color:var(--rangt)}
.endar{display:flex;justify-content:space-between;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:480px){.atburdur{grid-template-columns:1fr auto}.atburdur .ar{grid-column:1 / -1;min-width:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="haus"><a class="heim" href="../index.html">← Allir leikir</a><nav class="svaedaval" id="svaedaval" aria-label="Svæði"></nav></header>
  <div class="leikhaus">
    <h1>Tímalína</h1>
    <p>Raðaðu atburðunum í tímaröð með örvunum. Elsti atburðurinn á að vera efst. Ýttu svo á <b>Athuga</b>.</p>
  </div>
  <section class="spjald" style="display:flex;flex-direction:column;gap:14px">
    <div class="stada" id="stada"></div>
    <div class="endar"><span>Elst</span></div>
    <ol class="atburdir" id="atburdir"></ol>
    <div class="endar"><span>Nýjast</span></div>
    <p class="skilabod" id="skilabod" aria-live="polite"></p>
    <div class="takkar">
      <button class="takki" id="athuga" type="button">Athuga</button>
      <button class="takki fela" id="nyr" type="button">Nýir atburðir</button>
    </div>
  </section>
</div>
<script src="../js/gogn.js"></script>
<script src="../js/sameiginlegt.js"></script>
<script>
const $ = id => document.getElementById(id);
const FJOLDI = 5;
let rod, buid;

function arTexti(a) { return a < 0 ? Math.abs(a) + " f.Kr." : String(a); }

function nyrLeikur() {
  const valin = [], ar = new Set();
  for (const a of stokka(ATBURDIR.filter(iSvaedi))) {
    if (ar.has(a.ar)) continue;
    ar.add(a.ar); valin.push(a);
    if (valin.length === FJOLDI) break;
  }
  rod = valin; buid = false;
  // tryggja að upphafsröðin sé ekki rétt
  while (rod.every((a, i) => i === 0 || rod[i - 1].ar < a.ar)) rod = stokka(rod);
  $("skilabod").textContent = ""; $("skilabod").className = "skilabod";
  $("athuga").classList.remove("fela"); $("nyr").classList.add("fela");
  teikna(); synaStodu();
}

function teikna(nidurstada) {
  $("atburdir").innerHTML = rod.map((a, i) => `
    <li class="atburdur ${nidurstada ? nidurstada[i] : ""}">
      <span class="ar">${buid ? arTexti(a.ar) : "?"}</span>
      <span class="texti">${a.texti}</span>
      <span class="faerslur">
        <button type="button" data-i="${i}" data-d="-1" aria-label="Færa upp" ${i === 0 || buid ? "disabled" : ""}>↑</button>
        <button type="button" data-i="${i}" data-d="1" aria-label="Færa niður" ${i === rod.length - 1 || buid ? "disabled" : ""}>↓</button>
      </span>
    </li>`).join("");
}

function synaStodu() {
  const s = GEYMSLA.lesa("timalina", { umferdir: 0, fullkomnar: 0 });
  $("stada").innerHTML = `<span>Umferðir: <b>${s.umferdir}</b></span><span>Allt rétt: <b>${s.fullkomnar}</b></span>`;
}

$("atburdir").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || buid) return;
  const i = +b.dataset.i, j = i + +b.dataset.d;
  [rod[i], rod[j]] = [rod[j], rod[i]];
  teikna();
  const ny = $("atburdir").querySelectorAll(".faerslur")[j].querySelector(`[data-d="${b.dataset.d}"]`);
  if (ny && !ny.disabled) ny.focus();
});

$("athuga").onclick = () => {
  buid = true;
  const rett = rod.slice().sort((a, b) => a.ar - b.ar);
  const nid = rod.map((a, i) => a === rett[i] ? "rett" : "rangt");
  const fjoldi = nid.filter(x => x === "rett").length;
  const s = GEYMSLA.lesa("timalina", { umferdir: 0, fullkomnar: 0 });
  s.umferdir++; if (fjoldi === FJOLDI) s.fullkomnar++;
  GEYMSLA.skrifa("timalina", s);
  teikna(nid);
  const m = $("skilabod");
  m.textContent = fjoldi === FJOLDI ? "Allt rétt!" : `${fjoldi} af ${FJOLDI} á réttum stað. Rétt röð: ` + rett.map(a => arTexti(a.ar)).join(" → ");
  m.className = "skilabod " + (fjoldi === FJOLDI ? "rett" : "rangt");
  $("athuga").classList.add("fela"); $("nyr").classList.remove("fela");
  synaStodu();
};
$("nyr").onclick = nyrLeikur;

setjaSvaedaval(nyrLeikur);
nyrLeikur();
</script>
</body>
</html>
