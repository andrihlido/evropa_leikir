<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satt eða ósatt? · Evrópuleikir</title>
<link rel="stylesheet" href="../css/still.css">
<style>
.fullyrding{font-family:var(--display);font-weight:800;font-size:clamp(22px,4.5vw,30px);text-align:center;min-height:3.5em;display:flex;align-items:center;justify-content:center;padding:8px}
.svor{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svar{border:0;border-radius:12px;padding:18px;font-family:var(--display);font-weight:800;font-size:22px;cursor:pointer;color:#fff}
.svar[data-s="1"]{background:var(--rett)} .svar[data-s="0"]{background:var(--rangt)}
.svar:disabled{opacity:.35;cursor:default}
.svar.valid{opacity:1;outline:4px solid var(--ink);outline-offset:3px}
.skyring{background:#f3f6f9;border-radius:10px;padding:14px 16px;font-weight:600}
.framvinda{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.framvinda span{display:block;height:100%;background:var(--ink);transition:width .3s}
</style>
</head>
<body>
<div class="wrap">
  <header class="haus"><a class="heim" href="../index.html">← Allir leikir</a><nav class="svaedaval" id="svaedaval" aria-label="Svæði"></nav></header>
  <div class="leikhaus">
    <h1>Satt eða ósatt?</h1>
    <p>Lestu fullyrðinguna og veldu hvort hún er sönn eða ósönn. Eftir hvert svar sérðu skýringu úr bókinni.</p>
  </div>
  <section class="spjald" style="display:flex;flex-direction:column;gap:16px">
    <div class="stada" id="stada"></div>
    <div class="framvinda"><span id="framvinda" style="width:0"></span></div>
    <p class="fullyrding" id="fullyrding"></p>
    <div class="svor" id="svor">
      <button type="button" class="svar" data-s="1">Satt</button>
      <button type="button" class="svar" data-s="0">Ósatt</button>
    </div>
    <p class="skilabod" id="skilabod" aria-live="polite"></p>
    <p class="skyring fela" id="skyring"></p>
    <div class="takkar">
      <button class="takki fela" id="naesta" type="button">Næsta</button>
      <button class="takki fela" id="aftur" type="button">Spila aftur</button>
    </div>
  </section>
</div>
<script src="../js/gogn.js"></script>
<script src="../js/sameiginlegt.js"></script>
<script>
const $ = id => document.getElementById(id);
const FJOLDI = 10;
let rod, nr, stig, buid;

function nyrLeikur() {
  rod = stokka(FULLYRDINGAR.filter(iSvaedi)).slice(0, FJOLDI);
  nr = 0; stig = 0;
  $("aftur").classList.add("fela");
  synaFullyrdingu();
}

function synaFullyrdingu() {
  buid = false;
  $("fullyrding").textContent = rod[nr].texti;
  document.querySelectorAll(".svar").forEach(b => { b.disabled = false; b.classList.remove("valid"); });
  $("skilabod").textContent = ""; $("skilabod").className = "skilabod";
  $("skyring").classList.add("fela");
  $("naesta").classList.add("fela");
  synaStodu();
}

function synaStodu() {
  const met = GEYMSLA.lesa("satt-met", 0);
  $("stada").innerHTML = `<span>Spurning <b>${Math.min(nr + 1, rod.length)}</b> af ${rod.length}</span><span>Rétt: <b>${stig}</b></span><span>Met: <b>${met}</b></span>`;
  $("framvinda").style.width = (nr / rod.length * 100) + "%";
}

$("svor").addEventListener("click", e => {
  const b = e.target.closest(".svar"); if (!b || buid) return;
  buid = true;
  const f = rod[nr];
  const rett = (b.dataset.s === "1") === f.satt;
  document.querySelectorAll(".svar").forEach(x => x.disabled = true);
  b.classList.add("valid");
  if (rett) stig++;
  const m = $("skilabod");
  m.textContent = rett ? "Rétt!" : `Ekki rétt. Fullyrðingin er ${f.satt ? "sönn" : "ósönn"}.`;
  m.className = "skilabod " + (rett ? "rett" : "rangt");
  $("skyring").textContent = f.skyring;
  $("skyring").classList.remove("fela");
  nr++;
  if (nr >= rod.length) {
    const met = GEYMSLA.lesa("satt-met", 0);
    if (stig > met) GEYMSLA.skrifa("satt-met", stig);
    m.textContent += ` Leik lokið: ${stig} af ${rod.length} rétt.`;
    $("aftur").classList.remove("fela");
    synaStodu();
    $("stada").querySelector("b").textContent = rod.length;
  } else {
    $("naesta").classList.remove("fela");
    $("framvinda").style.width = (nr / rod.length * 100) + "%";
    $("stada").querySelectorAll("b")[1].textContent = stig;
  }
});
$("naesta").onclick = synaFullyrdingu;
$("aftur").onclick = nyrLeikur;

setjaSvaedaval(nyrLeikur);
nyrLeikur();
</script>
</body>
</html>
