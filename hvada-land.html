<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hvaða land er þetta? · Evrópuleikir</title>
<link rel="stylesheet" href="../css/still.css">
<style>
.visbendingar{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.visbendingar li{display:flex;gap:12px;align-items:flex-start;background:#f3f6f9;border-radius:10px;padding:10px 14px}
.visbendingar li .nr{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.visbendingar li.ny{animation:inn .35s ease-out}
@keyframes inn{from{opacity:.2;transform:translateY(-6px)}to{opacity:1;transform:none}}
.valkostir{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.valkostur{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:14px;font-weight:800;font-size:17px;cursor:pointer}
.valkostur:hover:not(:disabled){border-color:var(--ink)}
.valkostur.rett{background:var(--rett-bg);border-color:var(--rett);color:var(--rett)}
.valkostur.rangt{background:var(--rangt-bg);border-color:var(--rangt);color:var(--rangt);text-decoration:line-through}
.valkostur:disabled{cursor:default}
.stig-nu{text-align:center;font-weight:800;color:var(--muted)}
@media (max-width:420px){.valkostir{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="haus"><a class="heim" href="../index.html">← Allir leikir</a><nav class="svaedaval" id="svaedaval" aria-label="Svæði"></nav></header>
  <div class="leikhaus">
    <h1>Hvaða land er þetta?</h1>
    <p>Lestu vísbendinguna og veldu land. Ef þú svarar rangt kemur ný og auðveldari vísbending. Því færri vísbendingar, því fleiri stig.</p>
  </div>
  <section class="spjald" style="display:flex;flex-direction:column;gap:16px">
    <div class="stada" id="stada"></div>
    <ol class="visbendingar" id="visbendingar"></ol>
    <p class="stig-nu" id="stignu"></p>
    <div class="valkostir" id="valkostir"></div>
    <p class="skilabod" id="skilabod" aria-live="polite"></p>
    <div class="takkar">
      <button class="takki ljos" id="meira" type="button">Fá aðra vísbendingu</button>
      <button class="takki fela" id="naesta" type="button">Næsta land</button>
      <button class="takki fela" id="aftur" type="button">Spila aftur</button>
    </div>
  </section>
</div>
<script src="../js/gogn.js"></script>
<script src="../js/sameiginlegt.js"></script>
<script>
const $ = id => document.getElementById(id);
const UMFERDIR = 10;
let rod, umferd, stig, land, vis, synt, buid;

function buaTilVisbendingar(l) {
  const v = [];
  const st = stokka(l.stadreyndir);
  v.push(st[0]);
  v.push(l.matur.length ? "Þjóðlegur matur: " + l.matur.join(", ") + "." : (st[1] || "Tungumál: " + l.tungumal + "."));
  v.push(`„Takk“ á tungumáli landsins er „${l.takk}“.`);
  v.push(`Landið er ${talaIs(l.staerd)} km² og þar búa um ${ibuarTexti(l.ibuar)}.`);
  v.push(`Höfuðborgin er ${l.hofudborg}.`);
  return v;
}

function nyrLeikur() {
  rod = stokka(landaListi(l => l.hofudborg)).slice(0, UMFERDIR);
  umferd = 0; stig = 0;
  $("aftur").classList.add("fela");
  naestaLand();
}

function naestaLand() {
  land = rod[umferd];
  vis = buaTilVisbendingar(land);
  synt = 1; buid = false;
  const adrir = stokka(landaListi(l => l.hofudborg && l.id !== land.id && (validSvaedi() !== "allt" || l.svaedi === land.svaedi))).slice(0, 3);
  const valkostir = stokka([land, ...adrir]);
  $("valkostir").innerHTML = valkostir.map(l => `<button type="button" class="valkostur" data-id="${l.id}">${l.nafn}</button>`).join("");
  $("skilabod").textContent = ""; $("skilabod").className = "skilabod";
  $("naesta").classList.add("fela"); $("meira").classList.remove("fela");
  teiknaVis(); synaStodu();
}

function teiknaVis() {
  $("visbendingar").innerHTML = vis.slice(0, synt).map((t, i) =>
    `<li class="${i === synt - 1 ? "ny" : ""}"><span class="nr">${i + 1}</span><span>${t}</span></li>`).join("");
  $("stignu").textContent = buid ? "" : `Rétt svar núna gefur ${6 - synt} stig`;
  $("meira").disabled = synt >= 5 || buid;
}

function synaStodu() {
  const met = GEYMSLA.lesa("hvadaland-met", 0);
  $("stada").innerHTML = `<span>Land <b>${Math.min(umferd + 1, UMFERDIR)}</b> af ${UMFERDIR}</span><span>Stig: <b>${stig}</b></span><span>Met: <b>${met}</b></span>`;
}

function klara(rettSvar) {
  buid = true;
  const m = $("skilabod");
  document.querySelectorAll(".valkostur").forEach(b => {
    b.disabled = true;
    if (b.dataset.id === land.id) b.classList.add("rett");
  });
  if (rettSvar) { stig += 6 - synt; m.textContent = `Rétt! +${6 - synt} stig.`; m.className = "skilabod rett"; }
  else { m.textContent = `Landið var ${land.nafn}.`; m.className = "skilabod rangt"; }
  synt = 5; teiknaVis();
  $("meira").classList.add("fela");
  umferd++;
  if (umferd >= rod.length) {
    const met = GEYMSLA.lesa("hvadaland-met", 0);
    if (stig > met) GEYMSLA.skrifa("hvadaland-met", stig);
    m.textContent += ` Leik lokið: ${stig} stig af ${rod.length * 5} mögulegum.`;
    $("aftur").classList.remove("fela");
  } else $("naesta").classList.remove("fela");
  synaStodu();
}

$("valkostir").addEventListener("click", e => {
  const b = e.target.closest(".valkostur"); if (!b || buid || b.disabled) return;
  if (b.dataset.id === land.id) { klara(true); return; }
  b.classList.add("rangt"); b.disabled = true;
  if (synt >= 5 || document.querySelectorAll(".valkostur:not(:disabled)").length === 1) { klara(false); return; }
  synt++; teiknaVis();
  $("skilabod").textContent = "Ekki rétt. Hér er ný vísbending."; $("skilabod").className = "skilabod rangt";
});
$("meira").onclick = () => { if (synt < 5) { synt++; teiknaVis(); } };
$("naesta").onclick = naestaLand;
$("aftur").onclick = nyrLeikur;

setjaSvaedaval(nyrLeikur);
nyrLeikur();
</script>
</body>
</html>
