<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hærra eða lægra · Evrópuleikir</title>
<link rel="stylesheet" href="../css/still.css">
<style>
.spurning{text-align:center;font-family:var(--display);font-size:clamp(22px,4.5vw,30px);font-weight:800}
.einvigi{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.vs{align-self:center;font-family:var(--display);font-weight:800;color:var(--muted)}
.landspjald{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:22px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:border-color .15s,transform .1s}
.landspjald:hover:not(:disabled){border-color:var(--ink)}
.landspjald:active:not(:disabled){transform:scale(.98)}
.landspjald:disabled{cursor:default}
.landspjald .nafn{font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,30px)}
.landspjald .gildi{font-weight:800;font-size:clamp(18px,4vw,24px);font-variant-numeric:tabular-nums;min-height:1.4em}
.landspjald .gildi small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.landspjald.rett{border-color:var(--rett);background:var(--rett-bg)}
.landspjald.rangt{border-color:var(--rangt);background:var(--rangt-bg)}
.hlutfall{text-align:center;color:var(--muted);font-weight:700;min-height:1.5em}
.flokkaval{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.flokkaval button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;cursor:pointer}
.flokkaval button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (max-width:480px){.einvigi{grid-template-columns:1fr}.vs{justify-self:center}}
</style>
</head>
<body>
<div class="wrap">
  <header class="haus"><a class="heim" href="../index.html">← Allir leikir</a><nav class="svaedaval" id="svaedaval" aria-label="Svæði"></nav></header>
  <div class="leikhaus">
    <h1>Hærra eða lægra</h1>
    <p>Smelltu á landið sem þú heldur að sé stærra eða fjölmennara. Hversu mörg rétt svör nærðu í röð?</p>
  </div>
  <section class="spjald" style="display:flex;flex-direction:column;gap:18px">
    <div class="flokkaval" id="flokkaval">
      <button type="button" data-f="blandad" aria-pressed="true">Blandað</button>
      <button type="button" data-f="staerd" aria-pressed="false">Stærð</button>
      <button type="button" data-f="ibuar" aria-pressed="false">Íbúafjöldi</button>
    </div>
    <div class="stada" id="stada"></div>
    <p class="spurning" id="spurning"></p>
    <div class="einvigi" id="einvigi"></div>
    <p class="hlutfall" id="hlutfall"></p>
    <p class="skilabod" id="skilabod" aria-live="polite"></p>
    <div class="takkar"><button class="takki fela" id="naesta" type="button">Næsta</button></div>
  </section>
</div>
<script src="../js/gogn.js"></script>
<script src="../js/sameiginlegt.js"></script>
<script>
const $ = id => document.getElementById(id);
let flokkur = "blandad", rod = 0, par, spurt, buid;

function gildiTexti(l, f) {
  return f === "staerd" ? talaIs(l.staerd) + " km²" : ibuarTexti(l.ibuar);
}

function nyttPar() {
  const listi = landaListi();
  spurt = flokkur === "blandad" ? (Math.random() < .5 ? "staerd" : "ibuar") : flokkur;
  let a, b, tilraunir = 0;
  do {
    [a, b] = stokka(listi).slice(0, 2);
    tilraunir++;
  } while (a[spurt] === b[spurt] && tilraunir < 50);
  par = [a, b]; buid = false;
  $("spurning").textContent = spurt === "staerd" ? "Hvort landið er stærra að flatarmáli?" : "Í hvoru landinu búa fleiri?";
  $("einvigi").innerHTML = par.map((l, i) => `
    <button type="button" class="landspjald" data-i="${i}">
      <span class="merki ${l.svaedi}">${SVAEDI[l.svaedi].stutt}</span>
      <span class="nafn">${l.nafn}</span>
      <span class="gildi"></span>
    </button>`).join(`<span class="vs">eða</span>`);
  $("hlutfall").textContent = ""; $("skilabod").textContent = ""; $("skilabod").className = "skilabod";
  $("naesta").classList.add("fela");
  synaStodu();
}

function synaStodu() {
  const met = GEYMSLA.lesa("haerra-met", 0);
  $("stada").innerHTML = `<span>Rétt í röð: <b>${rod}</b></span><span>Met: <b>${met}</b></span>`;
}

$("einvigi").addEventListener("click", e => {
  const k = e.target.closest(".landspjald"); if (!k || buid) return;
  buid = true;
  const i = +k.dataset.i, valid = par[i], hitt = par[1 - i];
  const rett = valid[spurt] > hitt[spurt];
  document.querySelectorAll(".landspjald").forEach((s, j) => {
    s.disabled = true;
    s.querySelector(".gildi").innerHTML = gildiTexti(par[j], spurt) + `<small>${spurt === "staerd" ? "flatarmál" : "íbúar"}</small>`;
    const sigurvegari = par[j][spurt] > par[1 - j][spurt];
    if (sigurvegari) s.classList.add("rett");
    else if (j === i) s.classList.add("rangt");
  });
  const [st, mi] = par[0][spurt] > par[1][spurt] ? par : [par[1], par[0]];
  const hlut = st[spurt] / mi[spurt];
  const ord = spurt === "staerd" ? "stærra" : "fjölmennara";
  $("hlutfall").textContent = hlut < 1.1
    ? `${st.nafn} er aðeins örlítið ${ord} en ${mi.nafn}.`
    : `${st.nafn} er um ${hlut >= 10 ? talaIs(Math.round(hlut)) : talaIs(Math.round(hlut * 10) / 10)} sinnum ${ord} en ${mi.nafn}.`;
  const m = $("skilabod");
  if (rett) {
    rod++;
    if (rod > GEYMSLA.lesa("haerra-met", 0)) GEYMSLA.skrifa("haerra-met", rod);
    m.textContent = "Rétt!"; m.className = "skilabod rett";
    $("naesta").textContent = "Næsta";
  } else {
    m.textContent = `Ekki rétt. Þú náðir ${rod} réttum í röð.`; m.className = "skilabod rangt";
    rod = 0;
    $("naesta").textContent = "Byrja aftur";
  }
  $("naesta").classList.remove("fela");
  synaStodu();
});

$("naesta").onclick = nyttPar;
$("flokkaval").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  flokkur = b.dataset.f;
  document.querySelectorAll("#flokkaval button").forEach(x => x.setAttribute("aria-pressed", x === b));
  rod = 0; nyttPar();
});

setjaSvaedaval(() => { rod = 0; nyttPar(); });
nyttPar();
</script>
</body>
</html>
